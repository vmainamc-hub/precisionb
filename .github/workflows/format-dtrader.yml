name: Format DTrader integration

on:
  push:
    branches: ["integration/**"]

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Format DTrader integration') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/_authenticated/app.dtrader.tsx
      - run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/app.dtrader.tsx
          git commit -m "Format DTrader integration"
          git push