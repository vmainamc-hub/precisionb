name: Verify Precision Sentinel

on:
  push:
    branches: ["main", "integration/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx vitest run src/lib/liquidity/integration.test.ts
      - run: bunx eslint src/routes/_authenticated/app.dtrader.tsx
