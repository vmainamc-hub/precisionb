name: Verify Precision Sentinel

on:
  push:
    branches: ["main", "integration/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx eslint src/routes/_authenticated/app.dtrader.tsx src/lib/apex/core.ts src/lib/apex/types.ts src/lib/deriv/account-context.tsx src/components/app/AppTopBar.tsx src/lib/liquidity
